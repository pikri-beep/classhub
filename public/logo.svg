<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <g filter="url(#shadow)">
    <!-- Terminal dots -->
    <circle cx="170" cy="140" r="9" fill="#93C5FD" opacity="0.85"/>
    <circle cx="200" cy="140" r="9" fill="#93C5FD" opacity="0.6"/>
    <circle cx="230" cy="140" r="9" fill="#93C5FD" opacity="0.4"/>

    <!-- Left Angle Bracket < -->
    <path d="M 180 225 L 120 270 L 180 315" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Slash / -->
    <path d="M 285 200 L 225 340" fill="none" stroke="url(#accent-grad)" stroke-width="24" stroke-linecap="round" />

    <!-- Right Angle Bracket > -->
    <path d="M 330 225 L 390 270 L 330 315" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Subtitle Badge XI PPLG -->
    <rect x="136" y="375" width="240" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35" />
    <text x="256" y="409" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="4" text-anchor="middle">XI PPLG</text>
  </g>
</svg>
